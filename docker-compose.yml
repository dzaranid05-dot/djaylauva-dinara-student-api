name: djaylauva-dinara-student-api

services:
  db:
    image: postgres:16
    container_name: djaylauva-dinara-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dinara_pgdata:/var/lib/postgresql/data
    networks:
      - dinara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: djaylauva-dinara-student-api:v1.0-djaylauva-dinara-38086
    container_name: djaylauva-dinara-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dinara-net

volumes:
  dinara_pgdata:

networks:
  dinara-net:
